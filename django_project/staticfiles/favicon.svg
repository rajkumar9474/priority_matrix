<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Eisenhower Matrix grid -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="#ffffff" stroke-width="2" opacity="0.95" stroke-linecap="round"/>
  <line x1="7" y1="16" x2="25" y2="16" stroke="#ffffff" stroke-width="2" opacity="0.95" stroke-linecap="round"/>
  
  <!-- Quadrant indicators with modern style -->
  <!-- Q1: Urgent & Important (top-left) - Red -->
  <circle cx="11.5" cy="11.5" r="2.5" fill="#ef4444" opacity="0.95"/>
  <circle cx="11.5" cy="11.5" r="1.2" fill="#ffffff" opacity="0.4"/>
  
  <!-- Q2: Important • Not Urgent (top-right) - Amber -->
  <circle cx="20.5" cy="11.5" r="2.5" fill="#f59e0b" opacity="0.95"/>
  <circle cx="20.5" cy="11.5" r="1.2" fill="#ffffff" opacity="0.4"/>
  
  <!-- Q3: Urgent • Not Important (bottom-left) - Emerald -->
  <circle cx="11.5" cy="20.5" r="2.5" fill="#10b981" opacity="0.95"/>
  <circle cx="11.5" cy="20.5" r="1.2" fill="#ffffff" opacity="0.4"/>
  
  <!-- Q4: Not Urgent • Not Important (bottom-right) - Gray -->
  <circle cx="20.5" cy="20.5" r="2" fill="#64748b" opacity="0.85"/>
  <circle cx="20.5" cy="20.5" r="1" fill="#ffffff" opacity="0.3"/>
  
  <!-- Center point -->
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" opacity="0.9"/>
</svg>
